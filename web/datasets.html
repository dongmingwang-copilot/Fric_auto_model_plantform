<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数据集管理平台 - 金属表面磨损识别平台</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260606-dataset-admin8" />
  </head>
  <body class="monitor-page dataset-admin-page">
    <header class="topbar">
      <div>
        <h1>数据集管理平台</h1>
        <span id="datasetHealth">同步中</span>
      </div>
      <div class="top-actions">
        <label>工作台
          <select id="projectTypeFilter">
            <option value="">全部</option>
            <option value="generation">模型生成</option>
            <option value="optimization">模型升级</option>
          </select>
        </label>
        <button id="backHome">返回</button>
        <button id="refreshDatasets">刷新</button>
      </div>
    </header>

    <main class="dataset-admin-main">
      <section class="panel dataset-create-panel">
        <div class="section-head">
          <div>
            <h2>数据集定义</h2>
            <p class="muted">用项目名称、缺陷类别和标签颜色定义一类数据；内部标签由系统自动维护。</p>
          </div>
          <button id="newDatasetMode" type="button">清空选择</button>
        </div>
        <div class="dataset-form-grid compact-dataset-form">
          <label>项目名称 <input id="newDatasetName" placeholder="例如 Spall 小样本集" /></label>
          <label>缺陷类别 <input id="newDefectClass" placeholder="例如 Spall" /></label>
          <label>标签颜色 <input id="newLabelColor" type="color" value="#ff9e94" /></label>
          <label>阶段
            <select id="newProjectType">
              <option value="generation">模型生成</option>
              <option value="optimization">模型升级</option>
            </select>
          </label>
          <label class="wide">图像文件夹 <input id="newSourceDir" placeholder="选择或粘贴待导入图像目录" /></label>
        </div>
        <div class="dataset-form-actions">
          <button id="createImportDataset" type="button">创建并导入</button>
          <button id="saveDatasetSettings" type="button">保存定义</button>
          <button id="importIntoSelected" type="button">导入到选中数据集</button>
        </div>
        <div id="datasetFormStatus" class="muted"></div>
      </section>

      <section class="panel">
        <div class="section-head">
          <div>
            <h2>数据集目录</h2>
            <p class="muted">目录只显示项目、缺陷类别、颜色、数量、状态和最好 PT。</p>
          </div>
        </div>
        <div id="datasetTable" class="dataset-table"></div>
      </section>

      <section class="panel dataset-browser-panel">
        <div class="dataset-browser-header">
          <div>
            <h2>样本与最新 GT</h2>
            <p id="datasetBrowserSummary" class="muted">选择一个数据集后查看图像、掩码和 Review 状态。</p>
          </div>
          <div class="dataset-browser-tools">
            <label>状态
              <select id="itemStatusFilter">
                <option value="">全部</option>
                <option value="reviewed">已 Review</option>
                <option value="unreviewed">未 Review</option>
                <option value="predicted">有预测</option>
              </select>
            </label>
          </div>
        </div>
        <div class="dataset-browser-layout">
          <div id="datasetItemGrid" class="dataset-item-grid"></div>
          <aside id="datasetItemPreview" class="dataset-item-preview"></aside>
        </div>
      </section>

      <section class="panel">
        <h2>归档数据集</h2>
        <div id="datasetArchives" class="dataset-events"></div>
      </section>

      <section class="panel">
        <h2>最近数据集事件</h2>
        <div id="datasetEvents" class="dataset-events"></div>
      </section>
    </main>

    <script src="/static/datasets.js?v=20260606-dataset-admin8"></script>
  </body>
</html>
